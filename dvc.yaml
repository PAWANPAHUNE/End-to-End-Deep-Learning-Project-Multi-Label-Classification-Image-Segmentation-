stages:
  data_ingestion:
    cmd: python src/End_to_End_DL_Project/pipeline/data_ingestion_pipeline.py
    deps:
      - src/End_to_End_DL_Project/pipeline/data_ingestion_pipeline.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Data

  prepare_base_model:
    cmd: python src/End_to_End_DL_Project/pipeline/prepare_basemodel_pipeline.py
    deps:
      - src/End_to_End_DL_Project/pipeline/prepare_basemodel_pipeline.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model


  training:
    cmd: python src/End_to_End_DL_Project/pipeline/model_training_pipeline.py
    deps:
      - src/End_to_End_DL_Project/pipeline/model_training_pipeline.py
      - config/config.yaml
      - artifacts/data_ingestion/Data
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
    outs:
      - artifacts/training/model.h5


  evaluation:
    cmd: python src/End_to_End_DL_Project/pipeline/model_evaluation_pipeline.py
    deps:
      - src/End_to_End_DL_Project/pipeline/model_evaluation_pipeline.py
      - config/config.yaml
      - artifacts/data_ingestion/Data
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
    - scores.json:
        cache: false